name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Run Test and Build Apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lessoneditor
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: lessoneditor
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lessoneditor -d lessoneditor"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      NX_DAEMON: "false"
      NX_ISOLATE_PLUGINS: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      NODE_ENV: test
      GH_CLIENT_ID: ci-placeholder
      GH_CLIENT_SECRET: ci-placeholder-secret
      GH_CALLBACK_URL: http://localhost:44100/api/auth/callback
      COOKIE_SECRET: ci-cookie-secret-only
      SESSION_SECRET: ci-session-secret-only
      FRONTEND_URL: http://localhost:44100
      THUMB_SERVICE_URL: http://localhost:44112
      DISABLE_PULL_REQUESTS: "true"
      POSTGRES_USER: lessoneditor
      POSTGRES_PASSWORD: ci-local-only
      POSTGRES_DB: lessoneditor
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "55432"
      POSTGRES_SYNCHRONIZE: "false"
      POSTGRES_ENTITIES: dist/apps/backend/**/*.entity.js
      POSTGRES_MIGRATIONS: dist/apps/backend/db/migrations/*.js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run migration:run
      - run: npm run browser:install -- --install-deps
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-results
          path: test-results/
          if-no-files-found: ignore
