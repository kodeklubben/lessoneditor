version: 2
# One pull request a month per ecosystem, with all minor and patch updates together.
# Major versions are left out on purpose: they need code changes and testing (TypeScript 7,
# Babel 8, webpack-dev-server 6, @types/node beyond the Node version the app runs on), and are
# done in their own pull request. Security alerts still show under Security.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
